<!DOCTYPE html><html lang="en"><head>
		<meta charset="utf-8">
		<title>FoxHound - LuCI</title>
		<meta name="viewport" content="initial-scale=1.0">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/resources/css/cascade.css">
		<link id="fh-theme-css" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/resources/css/palette/dark.css">
		<script>(function(){try{var m=localStorage.getItem("foxhound_theme_mode");if(m==="light"){var l=document.getElementById("fh-theme-css");if(l)l.href=l.href.replace("dark.css","light.css");}}catch(e){}})();</script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/resources/css/mobile.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/resources/css/icons.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/resources/css/passwall.css">
		<link rel="icon" href="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/logo_48.png" sizes="48x48">
		<link rel="icon" href="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/logo.svg" sizes="any">

		<script src="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/resources/js/backbone.js"></script>
	</head>
	<body class="lang_en modal-overlay-active" data-page="">
<section hidden="">

</section>

<div id="view"></div>

<div id="modal_overlay" tabindex="-1"><div class="modal login" role="dialog" aria-modal="true"><h4>Authorization Required</h4><div class="fh-login-wrap">
  <div class="fh-logo">
    <img src="https://cdn.jsdelivr.net/gh/fullband7/openwrt-theme-foxhound@main/luci-theme-foxhound/www/luci-static/foxhound/resources/icons/logo.svg" alt="Login Logo">
    <p class="fh-logo-auth">Authorization Required</p>
  </div>

  <form method="post">
    <input type="hidden" name="_csrf" value="">

    <div class="fh-field">
      <span class="fh-field-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path>
        </svg>
      </span>
      <input name="luci_username" id="luci_username" type="text" autocomplete="username" placeholder="Username" value="root">
    </div>

    <div class="fh-field">
      <span class="fh-field-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </span>
      <input name="luci_password" id="luci_password" type="password" autocomplete="current-password" placeholder="Password">
    </div>

<a href="dashboard.html">
    <button type="button" class="fh-btn">Log in</button>
	</a>
  </form>

</div><hr style="display:none"><button class="btn cbi-button-positive important" style="display:none">Log in</button></div></div><div class="cbi-tooltip"></div><script>
(function(){
    function init(){
        var toggle=document.getElementById('fhDashToggle');
        var indicator=document.querySelector('.fh-dash-indicator');
        var label=document.getElementById('fhDashIndicatorLabel');
        if(!toggle||!indicator||!label)return;
        toggle.addEventListener('click',function(){
            var paused=indicator.classList.toggle('paused');
            label.textContent=paused?'Paused':'Refreshing';
            toggle.setAttribute('aria-pressed',paused?'true':'false');
        });
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body></html>
