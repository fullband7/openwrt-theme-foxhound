(function(){
    function init(){
        var toggle=document.getElementById('fhDashToggle');
        var indicator=document.querySelector('.fh-dash-indicator');
        var label=document.getElementById('fhDashIndicatorLabel');
        if(!toggle||!indicator||!label)return;
        toggle.addEventListener('click',function(){
            var paused=indicator.classList.toggle('paused');
            label.textContent=paused?'Paused':'Refreshing';
            toggle.setAttribute('aria-pressed',paused?'true':'false');
        });
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
